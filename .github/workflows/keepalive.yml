name: Keep Supabase awake

# Free Supabase projects pause after a week without activity.
# Day-of-month */5 never leaves a gap longer than 5 days, even across months.
on:
  schedule:
    - cron: '0 6 */5 * *'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Query the benches table
        run: |
          set -a
          . ./.env
          set +a
          curl --fail --silent --show-error \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" \
            "$VITE_SUPABASE_URL/rest/v1/benches?select=id&limit=1"
